name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

env:
  GOMAXPROCS: '4'
  GOFLAGS: '-p=2'
  GOWORK: 'off'
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  RELEASE_REPO: amuxos/amux-releases

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.25.14'
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.modules }}
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'buf.gen.yaml') }}
          restore-keys: |
            go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          # Use the checked-out release commit, including manual tag releases.
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'buf.gen.yaml') }}-${{ steps.version.outputs.commit }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'buf.gen.yaml') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          # Authenticate release lookups. Without a token the action uses the
          # unauthenticated GitHub API and shares the runner IP rate limit.
          github_token: ${{ github.token }}
      - run: bash scripts/check.sh

  draft:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.AMUX_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure AMUX_RELEASE_TOKEN with Contents write access to the release repository.' >&2; exit 1; }
          if gh release view "$RELEASE_VERSION" --repo "$RELEASE_REPO" --json isDraft > /tmp/release.json 2>/dev/null; then
            jq -e '.isDraft == true' /tmp/release.json >/dev/null || { echo 'Published releases are immutable.' >&2; exit 1; }
            echo "Reusing existing draft release $RELEASE_VERSION"
          else
            gh release create "$RELEASE_VERSION" --repo "$RELEASE_REPO" --draft \
              --title "amux $RELEASE_VERSION" --notes "amux $RELEASE_VERSION (build in progress)"
          fi

  build:
    needs: [check, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          # Cross-compile Windows amd64 (binaries + Go Setup.exe) from Linux.
          - runner: ubuntu-24.04
            os: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.25.14'
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.modules }}
          key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'buf.gen.yaml') }}
          restore-keys: |
            go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Cache Go build outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.build }}
          # Use the checked-out release commit, including manual tag releases.
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'buf.gen.yaml') }}-release-${{ needs.check.outputs.commit }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'buf.gen.yaml') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sidecars/claude-sdk/package-lock.json
      - env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          make sidecar
          npm prune --prefix sidecars/claude-sdk --omit=dev --ignore-scripts --no-audit --no-fund
          bash scripts/package-release.sh --version "$RELEASE_VERSION" \
            --os "$GOOS" --arch "$GOARCH" --with-sidecar \
            --base-url "https://github.com/$RELEASE_REPO/releases/download/$RELEASE_VERSION"
          if [ "$GOOS" != windows ]; then
            ./bin/amux --version
          else
            test -f ./bin/Setup.exe
            test -f ./bin/amux.exe
          fi
          mv dist/latest.json "dist/manifest_${GOOS}_${GOARCH}.json"
      - name: Upload package to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AMUX_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*_Setup.exe dist/*.sha256 dist/manifest_*.json)
          test "${#files[@]}" -gt 0 || { echo 'No release files produced.' >&2; exit 1; }
          gh release upload "$RELEASE_VERSION" --repo "$RELEASE_REPO" --clobber "${files[@]}"

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Verify and download platform assets from draft
        env:
          GH_TOKEN: ${{ secrets.AMUX_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure AMUX_RELEASE_TOKEN with Contents write access to the release repository.' >&2; exit 1; }
          gh release view "$RELEASE_VERSION" --repo "$RELEASE_REPO" --json isDraft,assets > /tmp/release.json
          jq -e '.isDraft == true' /tmp/release.json >/dev/null || { echo 'Published releases are immutable.' >&2; exit 1; }
          missing=0
          for platform in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64 windows_amd64; do
            expected=("amux_${RELEASE_VERSION}_${platform}.tar.gz" "manifest_${platform}.json")
            if [ "$platform" = windows_amd64 ]; then
              expected+=("amux_${RELEASE_VERSION}_${platform}_Setup.exe")
            fi
            for name in "${expected[@]}"; do
              if ! jq -e --arg n "$name" '.assets | any(.name == $n)' /tmp/release.json >/dev/null; then
                echo "Missing draft asset: $name" >&2
                missing=1
              fi
            done
          done
          test "$missing" = 0 || { echo 'Not all 5 platform packages are present on the draft release.' >&2; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_VERSION" --repo "$RELEASE_REPO" --dir dist \
            --pattern '*.tar.gz' --pattern '*_Setup.exe' --pattern 'manifest_*.json'
      - env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: python3 scripts/prepare-public-release.py dist "$RELEASE_VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.AMUX_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release upload "$RELEASE_VERSION" --repo "$RELEASE_REPO" --clobber \
            dist/*.sha256 dist/latest.json dist/version.txt dist/install.sh
          # Per-platform manifests were only staging inputs for latest.json.
          for manifest in dist/manifest_*.json; do
            gh release delete-asset "$RELEASE_VERSION" "$(basename "$manifest")" --repo "$RELEASE_REPO" --yes
          done
          gh release edit "$RELEASE_VERSION" --repo "$RELEASE_REPO" \
            --title "amux $RELEASE_VERSION" --notes-file dist/notes.md --draft=false --latest
