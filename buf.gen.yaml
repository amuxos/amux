version: v2

plugins:
  # Pin generators while reusing Go's module/build caches. Generation does not
  # require a remote code-generation service or preinstalled plugin binaries.
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: .
    opt:
      - module=github.com/amuxos/amux
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2]
    out: .
    opt:
      - module=github.com/amuxos/amux
      - require_unimplemented_servers=false
