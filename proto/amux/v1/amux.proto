// WaitAgentInstance joins the instance's current turn: it blocks while an
// instance TaskRun is in flight or its child session is active, and returns when
// no task remains and the child is sleeping/archived, or when the wait timeout
// elapses. An already sleeping/archived child with no in-flight task returns
// immediately; ordinary output does not end the wait. Activity is retained for
// compatibility and reports whether completion was observed during this call.
// State is authoritative for completion versus timeout.
