  string service = 1;
  string method = 2;
  string path = 3;
  map<string, string> headers = 4;
  bytes body = 5;
}
message ProxyModelChunk {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

message ListNativeModelsRequest {
  string agent_type = 1;
  ExecutionIdentity execution_identity = 2;
}

message NativeModel {
  string model = 1;
  string display_name = 2;
  repeated string reasoning_efforts = 3;
  string default_reasoning_effort = 4;
  bool is_default = 5;
}

message ListNativeModelsResponse {
  string status = 1; // ready or signed_out; transport/discovery failures are errors
  repeated NativeModel models = 2;
}

// Local Unix-socket administration only. Never routed through the Hub/tunnel.
service RuntimeMaintenance {
  rpc Maintain(MaintenanceRequest) returns (MaintenanceResponse);
}
message MaintenanceRequest {
  string action = 1; // begin, poll, renew, end
  string token = 2; // caller-generated idempotency/lease token
}
message MaintenanceResponse {
  string phase = 1; // draining, ready, recovering, idle
  repeated string busy_sessions = 2;
  int32 active_tasks = 3;
  int32 active_requests = 4;
  int32 sleeping_sessions = 5;
}

message SendFeishuMessageRequest {
  // Supplied by MCP from AMUX_SESSION_ID; verified against the actor credential.
  string session_id = 1;
  string receive_id = 2;
  string receive_id_type = 3;
  string reply_to_message_id = 4;
  bool reply_in_thread = 5;
  string text = 6;
  string uuid = 7;
  // Empty or "text" preserves plain text; "markdown" uses a rich-text post.
  string format = 8;
}
message SendFeishuMessageResponse {
  string message_id = 1;
  string chat_id = 2;
  string thread_id = 3;
  string bot_profile = 4;
  string uuid = 5;
}
