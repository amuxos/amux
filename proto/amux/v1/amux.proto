// SendAgentMessage enqueues a message into a persistent agent instance's mailbox
// without waking the agent (QueueOnly). When the instance is next woken by a
// instance_followup / instance_spawn, the mailbox is drained into the child session's
// input queue ahead of the new task prompt. Returns the number of messages now
// pending in the mailbox.
