syntax = "proto3";

package amux.v1;

option go_package = "github.com/amuxos/amux/internal/transport/pbgen;pbgen";

service Amuxlet {
  // Native discovery runs under the execution identity, on the selected Runtime.
  rpc ListNativeModels(ListNativeModelsRequest) returns (ListNativeModelsResponse);
  // Internal, trusted tunnel only; exact execution and bounded workspace paths.
  rpc PutSessionFile(SessionFileRequest) returns (SessionFileResponse);
  rpc ReadSessionArtifact(SessionFileRequest) returns (SessionFileResponse);
  rpc Run(RunRequest) returns (RunResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Kill(KillRequest) returns (KillResponse);
  rpc Restart(RestartRequest) returns (RunResponse);
  rpc ChangeCwd(ChangeCwdRequest) returns (ChangeCwdResponse);
  rpc Sleep(SleepRequest) returns (SleepResponse);
  rpc Resume(ResumeRequest) returns (RunResponse);
  rpc Prune(PruneRequest) returns (PruneResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc Attach(AttachRequest) returns (stream AttachEvent);
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc Goal(GoalRequest) returns (GoalResponse);
  rpc QueueList(QueueListRequest) returns (QueueListResponse);
  rpc QueueClear(QueueClearRequest) returns (QueueClearResponse);
  rpc QueueCancel(QueueCancelRequest) returns (QueueCancelResponse);
  rpc RespondPermission(RespondPermissionRequest) returns (RespondPermissionResponse);
  // Internal runtime query used by amuxd to verify that a local-expert write
  // originates from the active Feishu Bot-owner turn.
  rpc GetLocalExpertAuthoringTurn(LocalExpertAuthoringTurnRequest) returns (LocalExpertAuthoringTurnResponse);
  rpc RevokePrincipalLaunches(RevokePrincipalLaunchesRequest) returns (RevokePrincipalLaunchesResponse);
}

service Amuxd {
  // Model services reuse the authenticated actor; no upstream credentials leave the Hub.
  rpc ProxyModel(ProxyModelRequest) returns (stream ProxyModelChunk);
  rpc Run(AmuxdRunRequest) returns (RunResponse);
  rpc Info(HubInfoRequest) returns (HubInfoResponse);
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  rpc FeishuStatus(FeishuStatusRequest) returns (FeishuStatusResponse);
  rpc FeishuBindings(FeishuBindingsRequest) returns (FeishuBindingsResponse);
  rpc FeishuBots(FeishuBotsRequest) returns (FeishuBotsResponse);
  // Session-scoped Bot sending. Credentials and binding resolution stay on the Hub.
  rpc SendFeishuMessage(SendFeishuMessageRequest) returns (SendFeishuMessageResponse);
  rpc FeishuBotSessionStatus(FeishuBotSessionStatusRequest) returns (FeishuBotSessionStatusResponse);
  rpc FeishuBotSessionBind(FeishuBotSessionBindRequest) returns (FeishuBotSessionStatusResponse);
  rpc FeishuBotSessionOff(FeishuBotSessionOffRequest) returns (FeishuBotSessionStatusResponse);
  rpc FeishuContextExplain(FeishuContextExplainRequest) returns (FeishuContextExplainResponse);
  rpc Kill(AmuxdKillRequest) returns (KillResponse);
  rpc Restart(AmuxdRestartRequest) returns (RunResponse);
  rpc ChangeCwd(AmuxdChangeCwdRequest) returns (ChangeCwdResponse);
  rpc Sleep(AmuxdSleepRequest) returns (SleepResponse);
  rpc Resume(AmuxdResumeRequest) returns (RunResponse);
  rpc Prune(AmuxdPruneRequest) returns (PruneResponse);
  rpc Interrupt(AmuxdInterruptRequest) returns (InterruptResponse);
  rpc Attach(AmuxdAttachRequest) returns (stream AttachEvent);
  rpc Submit(AmuxdSubmitRequest) returns (SubmitResponse);
  rpc Goal(AmuxdGoalRequest) returns (GoalResponse);
  rpc QueueList(AmuxdQueueListRequest) returns (QueueListResponse);
  rpc QueueClear(AmuxdQueueClearRequest) returns (QueueClearResponse);
  rpc QueueCancel(AmuxdQueueCancelRequest) returns (QueueCancelResponse);
  rpc RespondPermission(AmuxdRespondPermissionRequest) returns (RespondPermissionResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  rpc SetScheduleEnabled(SetScheduleEnabledRequest) returns (SetScheduleEnabledResponse);
  rpc MaterializeCredential(MaterializeCredentialRequest) returns (MaterializeCredentialResponse);
  rpc SetCredential(SetCredentialRequest) returns (CredentialProfileMetadata);
  rpc GetCredential(GetCredentialRequest) returns (CredentialProfileMetadata);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc CreatePrincipal(CreatePrincipalRequest) returns (PrincipalResponse);
  rpc ListPrincipals(ListPrincipalsRequest) returns (ListPrincipalsResponse);
  rpc ListPrincipalAliases(ListPrincipalAliasesRequest) returns (ListPrincipalAliasesResponse);
  rpc DisablePrincipal(DisablePrincipalRequest) returns (PrincipalResponse);
  rpc BindPrincipalAlias(BindPrincipalAliasRequest) returns (PrincipalResponse);
  rpc GrantPrincipalDelegation(GrantPrincipalDelegationRequest) returns (GrantPrincipalDelegationResponse);
  rpc RevokePrincipalDelegation(RevokePrincipalDelegationRequest) returns (EmptyResponse);
  rpc GrantServicePrincipalMember(ServicePrincipalMemberRequest) returns (EmptyResponse);
  rpc RevokeServicePrincipalMember(ServicePrincipalMemberRequest) returns (EmptyResponse);
  rpc CreatePrincipalEnrollment(CreatePrincipalEnrollmentRequest) returns (CreatePrincipalEnrollmentResponse);
  rpc GetIsolationStatus(GetIsolationStatusRequest) returns (GetIsolationStatusResponse);
  // Agent Profile discovery is hub-central so isolated agent processes do not
  // need filesystem access to the service user's private Agent Pack registry.
  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse);
  rpc GetAgentProfile(GetAgentProfileRequest) returns (GetAgentProfileResponse);
  rpc ReadLocalExpert(ReadLocalExpertRequest) returns (ReadLocalExpertResponse);
  rpc ChangeLocalExpert(ChangeLocalExpertRequest) returns (ChangeLocalExpertResponse);
  // Memory belongs to the Hub and authenticated principal, not a Runtime or Profile.
  rpc GetMemoryBinding(MemoryBindingRequest) returns (MemoryBindingResponse);
  rpc MemorySearch(MemorySearchRequest) returns (MemorySearchResponse);
  rpc MemoryGet(MemoryGetRequest) returns (MemoryDocument);
  rpc MemoryUpsert(MemoryUpsertRequest) returns (MemoryWriteResponse);
  rpc MemoryForget(MemoryForgetRequest) returns (MemoryForgetResponse);
  rpc Tunnel(stream TunnelMsg) returns (stream TunnelMsg);
}

message MemoryBindingRequest {}
message MemoryBindingResponse {
  bool enabled = 1;
  // Scope precondition only; every call derives authority from authentication.
  string binding = 2;
}
message MemorySearchRequest {
  string query = 1;
  string path_prefix = 2;
  int32 limit = 3;
  string binding = 10;
}
message MemoryMatch {
  string path = 1;
  string snippet = 2;
  string revision = 3;
  int32 line = 4;
  bool truncated = 5;
}
message MemorySearchResponse {
  repeated MemoryMatch matches = 1;
  bool incomplete = 2;
  bool truncated = 3;
  int32 scanned_files = 4;
}
message MemoryGetRequest {
  string path = 1;
  int32 start_line = 2;
  int32 end_line = 3;
  int64 offset = 4;
  string binding = 10;
}
message MemoryDocument {
  string path = 1;
  string content = 2;
  string revision = 3;
  int32 start_line = 4;
  int32 end_line = 5;
  bool truncated = 6;
  int64 next_offset = 7;
  bool exists = 8;
}
message MemoryUpsertRequest {
  string path = 1;
  string content = 2;
  string expected_revision = 3;
  string binding = 10;
}
message MemoryWriteResponse {
  string path = 1;
  string revision = 2;
}
message MemoryForgetRequest {
  string path = 1;
  string expected_revision = 2;
  string binding = 10;
}
message MemoryForgetResponse {
  string path = 1;
  bool already_absent = 2;
}

service AmuxTask {
  // Internal task-plane query used by amuxd to bind a child task to the exact
  // active turn of its parent session on the hosting amuxlet.
  rpc ResolveParentTurn(ActiveTurnRequest) returns (ActiveTurnResponse);
  rpc SubmitSubtask(SubmitSubtaskRequest) returns (SubmitSubtaskResponse);
  rpc GetSubtask(GetSubtaskRequest) returns (GetSubtaskResponse);
  rpc ListSubtasks(ListSubtasksRequest) returns (ListSubtasksResponse);
  rpc PruneSubtasks(PruneSubtasksRequest) returns (PruneSubtasksResponse);
  rpc CancelSubtask(CancelSubtaskRequest) returns (CancelSubtaskResponse);
  rpc RespondSubtaskPermission(RespondSubtaskPermissionRequest) returns (RespondSubtaskPermissionResponse);
  rpc StreamSubtask(StreamSubtaskRequest) returns (stream SubtaskEvent);
  // Agent-instance (Phase 3) RPCs. These are the control-plane backing for the
  // amux.instance_spawn / instance_send / instance_followup / instance_wait /
  // instance_list / instance_interrupt MCP tools. ListAgentInstances / GetAgentInstance are answered
  // by amuxd from its durable agent-instance store (plus live child-session state
  // fanned out from the hosting amuxlets); SendAgentMessage / InterruptAgentInstance
  // / WaitAgentInstance are routed by amuxd to the amuxlet hosting the instance's
  // sticky target (or served locally on the amuxlet when no hub is configured).
  rpc ListAgentInstances(ListAgentInstancesRequest) returns (ListAgentInstancesResponse);
  rpc GetAgentInstance(GetAgentInstanceRequest) returns (GetAgentInstanceResponse);
  rpc SendAgentMessage(SendAgentMessageRequest) returns (SendAgentMessageResponse);
  rpc InterruptAgentInstance(InterruptAgentInstanceRequest) returns (InterruptAgentInstanceResponse);
  rpc WaitAgentInstance(WaitAgentInstanceRequest) returns (WaitAgentInstanceResponse);
  // DescribeAgentInstance returns the amuxlet-local live view (child-session
  // state + mailbox depth) for one instance. amuxd calls it on the hosting
  // amuxlet to enrich ListAgentInstances / GetAgentInstance; it is not a
  // user-facing MCP tool.
  rpc DescribeAgentInstance(DescribeAgentInstanceRequest) returns (DescribeAgentInstanceResponse);
  // CleanupAgentInstance destroys the durable environment (sandbox workspace /
  // home / non-secret state) of a persistent agent instance on its hosting
  // amuxlet, after amuxd has marked the instance archived (e.g. because its
  // owner session entered archived). The hosting amuxlet stops any live broker
  // for the instance's child session and removes the instance-keyed sandbox
  // directory. It is not a user-facing MCP tool.
  rpc CleanupAgentInstance(CleanupAgentInstanceRequest) returns (CleanupAgentInstanceResponse);
}

// CoordinationService is the Coordinator-facing control plane. It exposes
// backend-neutral collaborator/delegation identities; Task IDs, target refs,
// and backend refs never cross this wire.
service CoordinationService {
  rpc ListCollaborators(ListCollaboratorsRequest) returns (ListCollaboratorsResponse);
  rpc Delegate(DelegateRequest) returns (DelegateResponse);
  rpc GetDelegation(GetDelegationRequest) returns (GetDelegationResponse);
  rpc WaitDelegation(WaitDelegationRequest) returns (WaitDelegationResponse);
  rpc InterveneDelegation(InterveneDelegationRequest) returns (InterveneDelegationResponse);
  rpc CancelDelegation(CancelDelegationRequest) returns (CancelDelegationResponse);
}

message Session {
  string id = 1;
  string name = 2;
  string agent_type = 3;
  string state = 4;
  int32 pid = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  reserved 8;
  reserved "attach_ui";
  bool acp = 9;
  bool interrupt = 10;
  string cwd = 12;
  string protocol = 13;
  repeated string extra_args = 14;
  repeated string env = 15;
  string workspace_source = 16;
  string workspace_scope = 17;
  string agent_profile = 18;
  int64 idle_timeout_seconds = 19;
  int64 last_activity_at = 20;
  string last_sleep_reason = 21;
  bool auto_sleep_eligible = 22;
  string owner_task_id = 23;
  // agent_instance_id is the persistent agent instance id (Phase 3) that owns
  // this child session (named instance-<id>). Empty for ephemeral tasks and
  // ordinary user sessions. A non-empty value means the session is managed by
  // the agent-level lifecycle and skipped by idle reclaim.
  string agent_instance_id = 24;
  // effective_model is the user-facing model selected at launch, or (when
  // launch resolution was empty) the model confirmed by a structured provider
  // while starting/resuming its thread. Empty means it remains unknown to amux.
  string effective_model = 25;
  // cwd_switch is the conversation-preserving workspace switch strategy.
  // Empty means unsupported; current supported value is "resume".
  string cwd_switch = 26;
  string launch_id = 27;
  ExecutionIdentity execution_identity = 28;
  // Provider-confirmed modalities accepted by the current effective model.
  // Unknown or empty is intentionally treated as text-only by callers.
  repeated string input_modalities = 29;
  string input_capability_source = 30;
  // Positively discovered on the live provider; false for unsupported runtimes.
  bool goal_supported = 31;
}

message GoalRequest {
  string name = 1;
  string action = 2;
  string objective = 3;
  optional int64 token_budget = 4;
  string expected_session_id = 5;
}
message AmuxdGoalRequest {
  string target_id = 1;
  string name = 2;
  string action = 3;
  string objective = 4;
  optional int64 token_budget = 5;
  string expected_session_id = 6;
}
message GoalResponse {
  bool supported = 1;
  // Native GoalState JSON; empty after clear or when there is no objective.
  bytes goal_json = 2;
}

message ExecutionIdentity {
  string identity_mode = 1;
  string origin_actor_principal_id = 2;
  string effective_principal_id = 3;
  string requested_run_as = 4;
  string source = 5;
  string parent_execution_id = 6;
  string delegation_id = 7;
  string creation_authorization_decision_id = 8;
  string creation_policy_revision = 9;
  string principal_environment_ref = 10;
  string execution_state_ref = 11;
  string isolation_backend = 12;
}

message AgentProfileRequirements {
  repeated string agent_types = 1;
  repeated string runtime_tools = 2;
  repeated string features = 3;
  repeated string credentials = 4;
}

message AgentProfilePlacement {
  repeated string preferred_targets = 1;
  AgentProfileRequirements requires = 2;
}

message AgentProfileSpec {
  string ref = 1;
  string pinned_ref = 2;
  string namespace = 3;
  string name = 4;
  string revision = 5;
  string type = 6;
  string source = 7;
  string description = 8;
  string agents = 9;
  string agents_content = 10;
  string configured_model = 11;
  string extends = 12;
  repeated string skills = 13;
  repeated string skill_dirs = 14;
  AgentProfilePlacement placement = 15;
  string model = 16;
  repeated string default_args = 17;
  repeated string default_env = 18;
  repeated string env_refs = 19;
  string mcp_config = 20;
  string permission_policy = 21;
  AgentProfileProvider provider = 22;
  repeated string subagents = 23;
  repeated string envs = 24;
  repeated string supported_models = 25;
  string model_ref = 26;
  string model_kind = 27;
  string provider_ref = 28;
  map<string, string> credential_env_suggestions = 29;
  repeated AgentProfileSkillFile snapshot_skill_files = 30;
  // Independently selected execution runtime used to compose this immutable
  // launch snapshot. Empty identifies the legacy Profile-owned launch path.
  string runtime_ref = 31;
  // Independently selected reasoning effort. Empty keeps the runtime/model
  // default.
  string reasoning_effort = 32;
}

message AgentProfileSkillFile {
  string skill = 1;
  string path = 2;
  bytes data = 3;
  uint32 mode = 4;
}

message AgentProfileProvider {
  string platform = 1;
  // Explicit provider transport. Empty preserves the legacy adapter default
  // for old snapshots. New openai-compat providers should use responses,
  // responses-via-chat-completions, or chat-completions.
  string wire_api = 16;
  string api_key_env = 2;
  // Literal API key value rendered in place of api_key_env. When set, the
  // provider's own auth is self-contained: renders the literal directly and
  // does not request api_key_env from any credential store. Intended for
  // shared internal-gateway credentials where per-user secret isolation
  // should be bypassed.
  string api_key_literal = 15;
  string base_url = 3;
  string upstream_model = 4;
  int64 context_window = 5;
  string description = 6;
  string prompt_hint = 7;
  optional bool by_azure = 8;
  optional bool disable_failover = 9;
  map<string, string> thinking = 10;
  string read_timeout = 11;
  int64 max_tokens = 12;
  string ref = 13;
  string credential_profile = 14;
}

message AgentProfileSkillInfo {
  string name = 1;
  string description = 2;
}

message AgentProfileInfo {
  AgentProfileSpec profile = 1;
  repeated AgentProfileSkillInfo skills = 2;
}

message ListAgentProfilesRequest {}

message ListAgentProfilesResponse {
  repeated AgentProfileInfo profiles = 1;
  // A catalog can still contain the embedded builtin profiles when the
  // external registry is temporarily unreadable or invalid.
  string profiles_error = 2;
}

message GetAgentProfileRequest {
  string ref = 1;
}

message GetAgentProfileResponse {
  AgentProfileInfo profile = 1;
}

message RunRequest {
  string agent_type = 1;
  string name = 2;
  repeated string extra_args = 3;
  repeated string env = 4;
  string cwd = 5;
  string workspace_source = 6;
  string workspace_scope = 7;
  string agent_profile = 8;
  AgentProfileSpec profile_spec = 9;
  string repo = 10;
  string repo_ref = 11;
  int64 idle_timeout_seconds = 12;
  bool idle_timeout_seconds_set = 13;
  // Resolved only by amuxd. Direct clients must leave this empty.
  ExecutionIdentity execution_identity = 14;
  string launch_id = 15;
  // run_as is an unresolved client intent. amuxd consumes it and never
  // forwards it to amuxlet; direct runtime calls reject non-empty values.
  string run_as = 16;
  // Minted by amuxd for an identified launch and injected into the agent
  // process as AMUX_ACTOR_TOKEN, so the agent's own control-plane calls are
  // attributed to the principal it already runs as instead of arriving
  // unauthenticated. Never persisted with the session's recorded env.
  string agent_actor_token = 17;
  // Unix seconds. Travels with the token so a relaunch can warn about a
  // credential the hub minted long ago and no longer tracks per session.
  int64 agent_actor_token_expires_at = 18;
  // Session-level out-of-band instructions applied from the first launch
  // (see SubmitRequest.system_instructions).
  string system_instructions = 19;
}
message RunResponse {
  Session session = 1;
  // Non-fatal findings from this launch (e.g. an expired provider credential).
  // Callers surface them to the user; they never mean the launch failed.
  repeated string warnings = 2;
}

message MaterializeCredentialRequest {
  string profile = 1;
  string agent_type = 2;
  repeated string env_names = 3;
}

message MaterializeCredentialResponse {
  repeated string env = 1;
  map<string, string> files = 2;
  repeated string secrets = 3;
  string kind = 4;
  repeated string profiles = 5;
}

message SetCredentialRequest {
  string profile = 1;
  string env_name = 2;
  string value = 3;
  // Optional fail-closed assertion used by explicit Principal onboarding.
  string expected_principal_id = 4;
}

message GetCredentialRequest {
  string profile = 1;
}

message ListCredentialsRequest {}

message CredentialProfileMetadata {
  string profile = 1;
  string kind = 2;
  repeated string env_names = 3;
  repeated string file_names = 4;
  string path = 5;
}

message ListCredentialsResponse {
  repeated CredentialProfileMetadata profiles = 1;
}

message TargetCapabilities {
  repeated string agent_types = 1;
  repeated string features = 2;
  repeated string runtime_tools = 3;
  repeated string workspace_roots = 4;
  repeated string shells = 5;
  string path_style = 6;
  string network_profile = 7;
  repeated string credential_refs = 8;
  map<string, string> labels = 9;
  repeated AgentCapacity agents = 10;
  repeated string isolation = 11;
  repeated string workspace_policies = 12;
  map<string, CredentialProfileList> credential_profiles = 13;
  int32 max_sessions = 14;
  string isolation_helper_protocol = 15;
  string isolation_degraded_reason = 16;
}

message AgentCapacity {
  string type = 1;
  string protocol = 2;
  int32 max_concurrency = 3;
}

message CredentialProfileList {
  repeated string names = 1;
}

message RuntimeLoad {
  int32 current_sessions = 1;
  int32 reserved_slots = 2;
  map<string, int32> per_agent_running = 3;
  map<string, int32> per_agent_reserved = 4;
  bool disk_pressure = 5;
}

message Target {
  string id = 1;
  string name = 2;
  TargetCapabilities capabilities = 3;
  repeated Session sessions = 4;
  string version = 5;
  RuntimeLoad load = 6;
  string status = 7;
}

message ListRequest {}
message ListResponse {
  repeated Session sessions = 1;
}

message InfoRequest {}
message InfoResponse {
  string version = 1;
  int64 started_at = 2;
}

message HubInfoRequest {}
message HubInfoResponse {
  string version = 1;
  int64 started_at = 2;
}

message KillRequest {
  string name = 1;
}
message KillResponse {
  bool ok = 1;
}

message RestartRequest {
  string name = 1;
  bool refresh_profile = 2;
  // Freshly minted by amuxd for this relaunch. A relaunch otherwise replays the
  // credential stored at creation, which is how an agent silently loses its own
  // identity once that one lapses; restarting is the documented recovery.
  string agent_actor_token = 3;
  int64 agent_actor_token_expires_at = 4;
  // replacement atomically replaces the frozen execution snapshot while
  // retaining the amux session identity and workspace. It is used by the
  // Feishu singleton settings flow; ordinary restart leaves it unset.
  RunRequest replacement = 5;
  // preserve_history keeps the provider-native conversation when the runtime
  // type is unchanged, or injects a provider-neutral handoff on the next real
  // user turn when changing runtime types.
  bool preserve_history = 6;
}
message ChangeCwdRequest {
  string name = 1;
  string cwd = 2;
  bool wait = 3;
  bool interrupt = 4;
  string expected_cwd = 5;
  // defer_until_idle queues the workspace switch as the next lifecycle item.
  // It returns immediately and runs after the active turn but before ordinary
  // pending input, which is required for an agent changing its own session.
  bool defer_until_idle = 6;
}
message ChangeCwdResponse {
  Session session = 1;
  string previous_cwd = 2;
  string effective_cwd = 3;
  bool changed = 4;
  bool deferred = 5;
}
message SleepRequest {
  string name = 1;
}
message SleepResponse {
  bool ok = 1;
}
message ResumeRequest {
  string name = 1;
  string agent_actor_token = 2;
  int64 agent_actor_token_expires_at = 3;
}
message PruneRequest {}
message PruneResponse {
  int32 count = 1;
  repeated string names = 2;
}

message InterruptRequest {
  string name = 1;
  bool preserve_goal = 2;
}
message InterruptResponse {
  bool ok = 1;
}

message AttachRequest {
  enum TimelineMode {
    TIMELINE_MODE_UNSPECIFIED = 0;
    HISTORY = 1;
    FOLLOW = 2;
    TAIL = 3;
  }
  string name = 1;
  reserved 2;
  reserved "replay";
  // timeline_mode selects the durable canonical Timeline read contract and is
  // required. TIMELINE_MODE_UNSPECIFIED is rejected.
  TimelineMode timeline_mode = 3;
  // after_cursor is exclusive and opaque to clients. It is used by HISTORY
  // and FOLLOW; TAIL always starts after the current head.
  string after_cursor = 4;
}
message AttachEvent {
  enum Kind {
    OUTPUT = 0;
    STATE_CHANGE = 1;
    HEARTBEAT = 2;
    PERMISSION_REQUEST = 3;
    STRUCTURED = 4;
    ERROR = 5;
    USAGE = 6;
  }
  Kind kind = 1;
  bytes data = 2;
  string state = 3;
  string stop_reason = 4;
  string permission_id = 5;
  bytes permission_payload = 6;
  string source = 7;
  bool input = 8;
  string event_id = 9;
  int64 seq = 10;
  string provider = 11;
  string event_type = 12;
  string text = 13;
  string tool_id = 14;
  string tool_name = 15;
  string tool_title = 16;
  string tool_status = 17;
  bytes tool_input_json = 18;
  string tool_output_preview = 19;
  string error_message = 20;
  bytes usage_json = 21;
  bytes structured_json = 22;
  string turn_id = 23;
  int64 turn_seq = 24;
  // effective_model is session metadata. It can accompany the initial Attach
  // handshake or a later metadata event and does not belong to a turn.
  string effective_model = 25;
  // cursor and canonical_json are set only for canonical Timeline delivery.
  string cursor = 26;
  bool historical = 27;
  bool caught_up = 28;
  bytes canonical_json = 29;
  // TAIL catch-up snapshot of the active canonical TurnStarted. This does not
  // replay an event or advance the cursor; future events retain that Turn ID.
  bytes active_turn_start_json = 30;
}

message RespondPermissionRequest {
  string name = 1;
  string permission_id = 2;
  string option_id = 3;
  // option_ids carries multiple selected options for multiSelect user-input
  // permissions (item/tool/requestUserInput). Empty means single-select via
  // option_id. option_id is kept for single-select backward compatibility.
  repeated string option_ids = 4;
  // Cancel a correlated user-question batch without selecting an answer.
  bool cancel = 5;
  // Optional canonical turn binding; stale cards must not target a later turn.
  string turn_id = 6;
}
message RespondPermissionResponse {
  bool ok = 1;
}

message SubmitRequest {
  string name = 1;
  string text = 2;
  string source = 3;
  bool async = 4;
  bool preempt = 5;
  // The caller already interrupted the active turn before this priority submit.
  // The runtime must enqueue ahead of normal input without interrupting again.
  bool preempt_already_interrupted = 6;
  // Provider-neutral session control. Empty means ordinary text input.
  // Current supported values are "compact" and "clear" for Codex sessions.
  string control = 7;
  // Ordered provider-neutral input. When non-empty this takes precedence over
  // text; text remains for backward compatibility with existing clients.
  repeated InputPart parts = 8;
  // Trusted internal grant. Only the in-process Feishu Bridge sets this on a
  // direct tunnel request; AmuxdSubmitRequest deliberately has no equivalent.
  bool local_expert_authoring = 9;
  // Optional execution pin used after internal file materialization.
  string expected_session_id = 10;
  string expected_launch_id = 11;
  // Steer delivers the input into the turn that is executing now instead of
  // starting a new turn. When the active turn cannot accept it (no active
  // turn, provider without steer support, turn id mismatch, authorization
  // mismatch) the runtime falls back to ordinary queued input. Mutually
  // exclusive with preempt and control.
  bool steer = 12;
  // Optional steer precondition: only steer when this turn is still active.
  string steer_expected_turn_id = 13;
  // Session-level out-of-band instructions (for example the Feishu
  // foreground protocol and file-delivery note). Honored only when
  // manage_system_instructions is set. The runtime persists them for the
  // session and applies them as system/developer instructions on the next
  // provider launch; while the current launch does not carry them they are
  // appended to the input as a hidden fallback.
  string system_instructions = 14;
  // The caller owns the session's system instructions: an empty value clears
  // them for future launches.
  bool manage_system_instructions = 15;
}
message SubmitResponse {
  bool ok = 1;
  string turn_id = 2;
  repeated IgnoredInputPart ignored_parts = 3;
  string session_id = 4;
  string launch_id = 5;
  // Delivery reports how a steer request was applied: "steered" when injected
  // into the active turn, "queued" when it fell back to queued input. Empty
  // for ordinary submits.
  string delivery = 6;
  // Human-readable reason for a steer fallback.
  string steer_fallback_reason = 7;
  // How managed system instructions reached the provider: "system" when the
  // running launch carries them out of band, "inline" when they were
  // appended to the input. Empty when none were managed.
  string instructions_delivery = 8;
}

