# hub 主机的 ~/.amux/config.toml 关键片段。
# 由 `amux setup hub` 自动生成;此处仅作对照参考。

[hub]
# 监听地址。默认本地 127.0.0.1:7100;要让远端 runtime 连入,显式设成对外可达地址。
addr = "0.0.0.0:7070"
# distributed 监听地址必须配置 shared token; runtime 注册必须带同一 token。
token = "change-me-shared-secret"
# 建议:只允许白名单 target 注册。
allowed_targets = ["hub-box", "gpu-box-1", "gpu-box-2"]

[runtime]
# 本机 runtime 也可执行任务;给它一个可辨识的 id。
id = "hub-box"
name = "hub-box"
auto_start = false

# Agent Pack registry 默认位于 ~/.amux/agent-packs/registry.json。
# task-path profile 解析发生在 hub 主机;通常通过
# `amux agent pack add <namespace> <git-url-or-local-git-repo>` 注册,无需手写配置。

[cli]
default_target = "local"
